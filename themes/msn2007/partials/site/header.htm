<!-- Super Topbar -->
<div class="super-topbar">

        <span class="bold">{{ "now"|date("l, F j, Y") }}</span>
    </div>
    <div class="right-links">
        <a href="#">LOGIN</a>
    </div>
</div>

<!-- Header with Wave (Yellow Theme Reinstated) -->
<div class="header">
    <div id="canvas-bg"></div>
    <div class="logo-wrap">
        <div class="logo">
            <h1>COHERENT<span class="logo-ext">.sbs</span></h1>
        </div>
    </div>
</div>

<!-- Search Area -->
<div class="search-area">
    <form id="search_form" onsubmit="return false;" style="display:flex; flex-direction:column; gap:5px;">
        <label for="search_input" style="font-weight:bold; color:#444; font-size:11px;">Search:</label>
        <div style="display:flex; gap:5px;">
            <input type="search" id="search_input" style="flex:1; border: 1px solid #7f9db9; padding: 3px;" placeholder="e.g. Market Trends...">
            <input type="submit" value="Search" class="btn-primary">
        </div>
    </form>
</div>
