{% if posts.lastPage > 1 %}
    <ul class="pagination">
        {% if posts.currentPage > 1 %}
            <li><a href="{{ paginationUrl ~ (posts.currentPage - 1) }}">&larr; Prev</a></li>
        {% endif %}

        {% for page in 1..posts.lastPage %}
            <li class="{{ posts.currentPage == page ? 'active' : null }}">
                <a href="{{ paginationUrl ~ page }}">{{ page }}</a>
            </li>
        {% endfor %}

        {% if posts.lastPage > posts.currentPage %}
            <li><a href="{{ paginationUrl ~ (posts.currentPage + 1) }}">Next &rarr;</a></li>
        {% endif %}
    </ul>
{% endif %}
