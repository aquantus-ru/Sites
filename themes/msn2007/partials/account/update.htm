{{ form_ajax('onUpdate', { files: true }) }}

    <div class="form-group">
        <label for="accountName">Full Name</label>
        <input name="name" type="text" class="form-control" id="accountName" value="{{ user.name }}">
    </div>

    <div class="form-group">
        <label for="accountEmail">Email</label>
        <input name="email" type="email" class="form-control" id="accountEmail" value="{{ user.email }}">
    </div>

    <div class="form-group">
        <label>Avatar</label>
        {% if user.avatar %}
            <div style="margin-bottom:5px;">
                <img src="{{ user.avatar.thumb(100, 100) }}" style="border:1px solid #ccc; padding:2px;">
            </div>
        {% endif %}
        <input name="avatar" type="file" class="form-control">
    </div>

    <div class="form-group">
        <label for="accountSignature">Signature</label>
        <textarea name="signature" class="form-control" id="accountSignature" rows="3">{{ user.winter_forum_member.signature }}</textarea>
        <span class="help-block" style="font-size:10px; color:#999;">For forum posts.</span>
    </div>

    <hr style="border:0; border-top:1px dashed #ccc; margin:15px 0;">

    <h4 style="margin-top:0;">Change Password</h4>

    <div class="form-group">
        <label for="accountPassword">New Password</label>
        <input name="password" type="password" class="form-control" id="accountPassword">
    </div>

    <div class="form-group">
        <label for="accountPasswordConfirm">Confirm New Password</label>
        <input name="password_confirmation" type="password" class="form-control" id="accountPasswordConfirm">
    </div>

    {% if updateRequiresPassword %}
        <p>To change these details, please confirm your current password.</p>
        <div class="form-group">
            <label for="accountPasswordCurrent">Current Password <small class="text-danger">* required</small></label>
            <input name="password_current" type="password" class="form-control" id="accountPasswordCurrent">
        </div>
    {% endif %}

    <button type="submit" class="btn btn-primary" style="margin-top:10px;">Save Changes</button>

{{ form_close() }}
